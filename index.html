<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrabuilt | Under Construction</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #7d8b76;
            color: #2d3034;
            font-family: 'Poppins', sans-serif;
        }
        
        /* Logo styling */
        .logo-container img {
            max-width: 180px;
            height: auto;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <!-- Top Center Logo Placeholder -->
    <div class="logo-container mb-12">
        <!-- Replace 'logo.png' with your actual filename once uploaded -->
        <img src="logo.png" alt="Terrabuilt Logo" onerror="this.style.display='none'; document.getElementById('logo-placeholder').style.display='block';">
        <div id="logo-placeholder" style="display:none;" class="uppercase tracking-[0.5em] font-semibold text-xl opacity-40">
            [ Logo Space ]
        </div>
    </div>

    <div>
        <h1 class="text-3xl md:text-5xl font-semibold tracking-[0.2em] mb-4">
            terrabuilt
        </h1>
        <div class="w-12 h-[2px] bg-[#2d3034] mx-auto mb-6 opacity-30"></div>
        <p class="text-sm md:text-base uppercase tracking-[0.3em]">
            Under Construction
        </p>
    </div>

    <footer class="absolute bottom-8 text-[10px] uppercase tracking-[0.2em] opacity-60 font-light">
        &copy; 2026 Terrabuilt Architecture
    </footer>

</body>
</html>
