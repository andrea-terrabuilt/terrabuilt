<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrabuilt | Under Construction</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #7d8b76;
            color: #2d3034;
            font-family: 'Poppins', sans-serif;
        }
        
        /* Responsive Logo sizing */
        .logo-container img {
            width: 220px; /* Base size for mobile */
            height: auto;
        }

        @media (min-width: 768px) {
            .logo-container img {
                width: 320px; /* Larger size for tablets/desktops */
            }
        }

        @media (min-width: 1440px) {
            .logo-container img {
                width: 400px; /* Extra large for wide screens */
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-8 text-center">

    <!-- Top Center Logo Placeholder -->
    <div class="logo-container mb-8 md:mb-16">
        <!-- Replace 'terrabuilt-logo.png' with your actual filename -->
        <img src="terrabuilt-logo.png" alt="Terrabuilt Logo" class="mx-auto" onerror="this.style.display='none'; document.getElementById('logo-placeholder').style.display='block';">
       
    </div>

    <div class="max-w-2xl">
        <div class="w-16 md:w-24 h-[2px] bg-[#2d3034] mx-auto mb-8 opacity-30"></div>
        <p class="text-base md:text-xl lg:text-2xl uppercase tracking-[0.4em] font-light">
            Under Construction
        </p>
    </div>

    <footer class="absolute bottom-8 w-full left-0 px-6 text-[10px] md:text-xs uppercase tracking-[0.2em] opacity-60 font-light">
        &copy; 2026 terrabuilt
    </footer>

</body>
</html>
